# 실험 하나. 라운드 manifest 에 그대로 기록된다.
#
# ── 무엇이 자동이고 무엇을 적어야 하나 ─────────────────────────────────────────
#
# 데이터에서 자동으로 나온다 (여기 적지 않는다):
#   robot_type, action/state 차원, 그룹 경계, 카메라 개수·이름, language prompt
#     ← <세션>/meta/{modality.json, info.json, tasks.jsonl}
#   embodiment 3종(openarm_lefthand 28차원·카메라2, rby1m_rh56f1 34·3,
#   rby1m_wuji2 66·2)으로 검증됨. 세션들의 modality 가 다르면 학습을 시작하지 않는다.
#
# 코드에서 유도된다:
#   full_action_dim = replan_steps x action_dim        (critic 이 보는 액션 차원)
#   target_entropy  = -(활성 차원 수) / 2
#   critic 인코더 입력 채널 = 3 x 카메라 수, 해상도는 내부에서 224x224 로 맞춤
#   gamma_eff = discount ** replan_steps               (실효 할인)
#
# 이 파일에 적어야 하는 것: base_policy, action_horizon, replan_steps,
#   inference_latency, explore_groups. 전부 "고르는 값" 이 아니라 외부 사실을 베끼는 것.
#
# 지켜야 하는 제약 (코드가 검사한다):
#   action_horizon >= inference_latency + replan_steps
#   replan_steps      == rrc controller 의 execution_horizon
#   inference_latency == rrc controller 의 inference_latency_steps
#   action_horizon    == 모델 config 의 action_horizon
#
# 아직 단순화해 둔 것 (알고 쓰는 것):
#   보상 n-step 창은 결정 시점 기준 [t, t+replan) 이다. RTC 지연을 엄격히 따르면
#   [t+latency, t+latency+replan) 이지만, 보상이 성공 에피소드 마지막 1프레임뿐이라
#   (sparse terminal) 크레딧이 최대 latency 프레임 이동하는 정도의 차이다.
#   mask = 1 - done 은 next.truncated 가 항상 0 이라는 데이터 관찰에 근거한다
#   (rl/data.py 검사 8 이 아니면 FAIL 로 잡는다).
#
# 여기 없는 것은 **데이터에서 온다** (손으로 적지 않는다):
#   embodiment/차원/그룹/카메라  ← <세션>/meta/modality.json  (convert_data.py --modality 가 심음)
#   language prompt              ← <세션>/meta/tasks.jsonl
#   robot_type                   ← <세션>/meta/info.json
# paths.sh 에도 두지 않는다 — 그건 "이 머신의 사실"이고 아래는 "이 실험의 사실"이다.

name: fuji
robot: rby1m_rh56f1          # 데이터의 robot_type 과 교차검증용

# --- 모달리티 레이아웃의 정본 -------------------------------------------------
# BC 학습에 쓴 RLDX 등록 config (third_party/RLDX-1 기준 상대경로).
#
# **state/action/video 의 concat 순서는 이 파일이 정본이다.** modality.json 의
# start/end 는 raw 컬럼에서 잘라낼 때만 쓴다. 두 순서가 같다는 보장이 없다:
#   openarm_inspire       등록: neck, left_arm, right_arm, left_hand, right_hand
#                    modality.json(start 순): neck, left_arm, left_hand, right_arm, right_hand  ← 다름
#   rby1_f1               둘이 우연히 일치
# 어긋난 채로 쓰면 모델 공간과 critic 입력의 관절이 조용히 뒤섞이고, explore_groups 도
# 다른 관절을 가리킨다 (openarm 이면 right_arm 대신 left_hand 를 탐색하게 된다).
#
# 다른 embodiment: openarm → openarm_inspire_config.py,
#                  rby1m_wuji2 → rby1_wujihand2_data_config_egostereo_general_embodiment.py
rldx_data_config: rldx/configs/data/rby1_f1_config.py

# state/action 그룹 경계의 정본 (rd-rl 상대경로). 순서는 위 rldx_data_config 가 정한다.
modality: modality/rby1m_rh56f1/modality.json

# --- 정책 -------------------------------------------------------------------
# $A_CKPT / $L_CKPT 아래 상대경로 (양쪽에서 같은 상대경로를 쓴다).
# TODO: rby1m_rh56f1 BC 체크포인트 경로. 아직 없음.
base_policy: rldx-img-curated/rldx_img_curated-0810-0818-r03

# --- 액션 청크 --------------------------------------------------------------
# 우리가 고르는 값이 아니라 외부 사실을 베끼는 것이다:
#   action_horizon  = 모델 config 의 action_horizon
#                     (learner 가 체크포인트 experiment_cfg/final_model_config.json 과 교차검증)
#   replan_steps    = rrc controller 의 execution_horizon. 어긋나면 n-step 리턴과 실제 실행
#                     길이가 달라져 critic 이 엉뚱한 것을 학습한다.
#
# 참고 (rrc configs/controllers/):
#   openarm_rh56f1      chunk 16 / exec  8 / latency  2
#   allex_p3            chunk 40 / exec 16 / latency  4
#   rby1m_wujihand      chunk 40 / exec 15 / latency 12
# TODO: rby1m_rh56f1 추론 컨트롤러가 rrc 에 아직 없다. 만들 때 값을 여기와 맞출 것.
action_horizon: 40
replan_steps: 8

# RTC 지연. 추론은 8스텝 경계보다 latency 스텝 **먼저** 시작하고, 이미 확정된 latency 개
# 액션이 prefix 로 들어간다. 그래서 obs(t) 에서 뽑은 청크 중 **실제로 실행되는 구간은
# [latency, latency+replan_steps)** 이다:
#
#   critic 액션 = chunk[latency : latency+replan_steps]
#     위치 0..latency-1 은 prefix 가 붙잡아 후보끼리 거의 같고 (판별력 희석),
#     새로 계획되어 실제 실행되는 뒤쪽 latency 개는 아예 못 보게 되므로 오프셋이 필요하다.
#   actor BC 대상 = 청크 전체 (RLDX 가 학습한 obs(t) → actions[t:t+H] 정렬 그대로)
#
# action_horizon >= latency + replan_steps 여야 한다 (40 >= 11).
inference_latency: 3

# --- 탐색 범위 --------------------------------------------------------------
# residual(edit) policy 를 적용할 action 그룹. modality.json 의 그룹 이름을 쓴다.
# 여기 없는 그룹은 residual 이 0 이 되어 base VLA 출력이 그대로 실행된다.
# EXPO-FT 의 residual_action_xyzg (회전 3축 마스킹) 를 그룹 단위로 일반화한 것.
#
# 주의: target_entropy = -full_action_dim/2 는 마스킹을 모르기 때문에, 활성 차원이
# 56/272 (20.6%) 이면 엔트로피 예산의 대부분이 아무 효과 없는 차원에 쓰인다.
# EXPO-FT 원본도 같은 구조(4/7 활성)이므로 그대로 두고 `temperature` / `entropy` /
# `select_ratio_with_residual` 지표로 관찰한다.
# **비워 두면 전체 차원을 탐색한다** — 그 경우 target_entropy = -full_action_dim/2 가 되어
# EXPO-FT 원본 공식과 정확히 일치한다 (openarm 28차원으로 확인: active 100%, -112).
explore_groups:
  - right_arm_joints

# --- EXPO-FT 알고리즘 값 ----------------------------------------------------
# openarm_rim.yaml 과 같은 블록. 원본 값이고 바꾸지 않는다 (바꾸면 파일에 보이고
# 라운드 manifest 에 기록된다).
expo:
  N: 8
  n_edit_samples: 8
  edit_scale: 0.01
  num_qs: 10
  num_min_qs: 2
  critic_layer_norm: true
  discount: 0.99          # 실효 0.99^8 = 0.9227 → 유효 지평 12.9 매크로 스텝
  tau: 0.005
  actor_lr: 3.0e-4        # ★ residual(edit) actor 의 lr
  critic_lr: 3.0e-4
  temp_lr: 3.0e-4
  latent_dim_image: 512
  latent_dim_state: 64
  include_state: true
  hidden_dims: [256, 256, 256]
  encoder_stage_sizes: [3, 4, 6, 3]
  encoder_num_filters: 64
  init_temperature: 1.0
  entropy_scale: 1.0
  batch_size: 128
  utd_ratio: 20
  freeze_critic_encoder: false
  actor_success_only: true

vla:
  lora_rank: 16
  lora_lr: 3.0e-4
  freeze_backbone: true

# --- 라운드 운영 ------------------------------------------------------------
# 주의: 이 태스크는 에피소드가 약 1200 프레임(150 매크로 스텝)이다. openarm(31)의 4.8배라
#   - 유효 지평 12.9 스텝이 에피소드의 8.6% 밖에 안 덮는다 (openarm 은 42%)
#   - 에피소드당 transition 이 많아 라운드당 학습량이 같은 updates_per_episode 로도 커진다
#   - 이미지가 3카메라라 프레임당 저장량이 openarm 의 1.5배
# Phase D 에서 "에피소드 구간별 Q 기울기" 를 보고 discount 를 논의한다.
#
# EXPO-FT 프로토콜과의 대응 (third_party/expo-ft/scripts/pick/run_server.sh):
#   seed_dataset + seed_teleop_episodes   ← --num_data=10. BC SFT 에 쓴 성공 데모를
#                                            온라인 리플레이 버퍼에 그대로 섞는다
#                                            (offline_ratio=0 경로 = 우리 유일한 경로)
#   updates_per_episode                   ← --num_updates=3 / --update_type=episode
#   min_online_episodes                   ← can_update 의 `ep_count >= 10` (하드코딩)
#
# 원본과 다른 점: 원본은 에피소드 하나가 끝날 때마다 3회 업데이트한다. 우리는 로봇이
# 원격이라 라운드(에피소드 여러 개)로 묶어 3 × 라운드에피소드수 를 한꺼번에 돈다. 총
# 업데이트 수는 같지만 한 라운드 안의 에피소드는 전부 같은 θ 로 수집된다 (그만큼 덜
# on-policy 다). episodes_per_round 는 actor 가 몇 개씩 보낼지에 대한 약속이고 learner 는
# 받은 만큼 학습한다 — 코드가 강제하지 않는다.
round:
  episodes_per_round: 5
  updates_per_episode: 3

  # --- 시드 데모 (라운드 0 전에 버퍼에 미리 들어간다) --------------------------
  # repo 상대경로. 이 아래의 LeRobot 세션들에서 에피소드를 골라 버퍼 **맨 앞**에 넣는다.
  # 비우면 시드 없이 시작한다.
  seed_dataset: rl-dataset/t0
  # 세션당 최대 개수. 성공이 이보다 적으면 있는 만큼만 담는다 (실패로 채우지 않는다).
  # t0 는 18개 중 성공 6개라 지금은 6개가 들어간다.
  seed_teleop_episodes: 10
  # 성공 에피소드만 담는다. EXPO-FT 는 성공 데모 디렉토리(.../success)를 통째로 받았고,
  # actor 배치가 actor_success_only 로 성공 프레임에서만 뽑히므로 실패를 채워 넣어도
  # actor 쪽에는 쓸모가 없고 critic 쪽 분포만 바꾼다.
  seed_success_only: true

  # --- 학습 시작 게이트 --------------------------------------------------------
  # **온라인 롤아웃** 에피소드 누적이 이 수에 닿기 전에는 버퍼에만 넣고 학습하지 않는다.
  # 시드 teleop 은 세지 않는다 (원본 ep_count 와 같은 의미).
  min_online_episodes: 10

  # TODO: 아직 코드가 읽지 않는다. 버퍼는 라운드마다 무한히 누적된다 (EXPO-FT 는
  # capacity=max_steps 인 링버퍼). fuji 는 에피소드가 1200 프레임이라 100k 면 약
  # 83 에피소드에서 걸린다 — 그 근처에 가기 전에 붙일 것.
  buffer_capacity: 100000
