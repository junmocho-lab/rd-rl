# fuji (rby1m_rh56f1) — **온라인 EXPO-FT RL** (actor 로컬 / learner 학습서버 라운드 루프).
#
# fuji_d4r16 (오프라인 critic 학습용) 에서 갈라져 나온 것. 다른 점:
#   1. base_policy 가 hilw1-dp5 checkpoint-30000 (2026-09-04 확정).
#      config.json 실측: action_horizon 40, rtc_training_max_delay 8 (>= inference_latency 4 ✓),
#      n_cog_tokens 64. **로컬($A_CKPT)과 학습서버($L_CKPT) 양쪽에 같은 상대경로로 둘 것.**
#      학습서버 실경로: /data/rlwrld-unified-checkpoints/younghoon_shin/checkpoints/<base_policy>
#      로컬은 $A_CKPT 아래 같은 상대경로에 심볼릭 링크 (원본: ~/fuji_ws/model_ckpt/).
#   2. critic: 블록 — EXPOLearner 가 ResNet 이미지 critic 대신 **qvgm cog-feature critic**
#      (오프라인 fuji_d4r16_0902 critic 과 같은 구조) 를 만든다. 처음부터 학습한다
#      (critic warm start 없음 — cog feature 가 base 모델마다 달라 이식이 안 된다).
#   3. round: 블록 — learner/loop.py 의 라운드 학습 게이트/시드.
#
# rrc 쪽: execution_horizon=16, inference_latency_steps=4 (d4r16 과 동일).

name: fuji_online
dataset: rl-dataset/fuji/0831_fuji_all_nostop     # (참고용 — 온라인 버퍼는 round 로 쌓인다)
robot: rby1m_rh56f1

rldx_data_config: rldx/configs/data/rby1_f1_config.py
modality: modality/rby1m_rh56f1/modality.json

# <checkpoints>/ 아래 상대경로 — actor 와 learner 양쪽에 이 경로로 배치한다.
base_policy: rldx-img-curated/rldx_img_0827-0903-hilw1-dp5-30k-4gpu-128b/checkpoint-30000

action_horizon: 40
replan_steps: 16
inference_latency: 4

# --- critic 백엔드: qvgm cog-feature (learner/loop.py qvgm_spec 이 읽는다) ------
# 값은 fuji_d4r16_0902 오프라인 critic 체크포인트 실측과 동일. action_index 는
# explore_groups x 창 전체 [0, latency+replan) 로 자동 유도된다 (오른팔 7관절 x 20스텝
# = 140차원). dfeat 4096 은 RLDX-1-VLM cognition token 의 mean-pool 차원.
critic:
  dfeat: 4096
  latent: 2048
  state_latent: 256
  hidden: [1024, 512]
  bins: 128
  q_range: [0.0, 1.0]
  inject: true
  n_steps: 1

explore_groups:
  - right_arm_joints

expo:
  N: 8
  n_edit_samples: 8
  # 0.002 — "base 보존 최우선" 체제 (fuji_online_2, 데이터 수집 전 결정).
  # base 산포(0.018)의 1/9 라 edit 후보가 base 구름 안에 파묻힌다: 성공률은 base(80~90%)
  # 그대로 지켜지는 대신 **결과의 edit 귀속 신호는 사실상 0 — qstd 바닥은 이 체제의
  # 예상 동작이지 이상이 아니다.** 개선 통로는 edit 학습이 아니라 critic 의 base 후보
  # selection (dexjoco sel 실측 +17.5pp 경로). 참고: 0.02 실측은 성공 ~30% 로 과함
  # (fuji_online_1 r0~r4, 0904_fuji_expo_ft_issue.md).
  edit_scale: 0.002
  num_qs: 10
  num_min_qs: 2
  critic_layer_norm: true
  # 프레임당 할인 (fuji 평균 617프레임 → 0.998^617 = 0.27). fuji_d4r16 주석 참고.
  discount: 0.998
  tau: 0.005
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  temp_lr: 3.0e-4
  # 아래 4개는 legacy ResNet critic 용 — critic: 블록이 있으면 쓰이지 않지만
  # ExpoConfig 필드라 남겨 둔다 (residual actor 의 latent_dim_state/hidden 은 쓰인다).
  latent_dim_image: 512
  latent_dim_state: 64
  include_state: true
  hidden_dims: [256, 256, 256]
  encoder_stage_sizes: [3, 4, 6, 3]
  encoder_num_filters: 64
  init_temperature: 1.0
  entropy_scale: 1.0
  # rank 당 값. 유효 배치 = batch_size x GPU 수 — 4 GPU(torchrun)면 32x4=128.
  # 단일 GPU 로 돌릴 때는 128 로 되돌릴 것 (유효 배치를 128 로 유지).
  batch_size: 32
  utd_ratio: 20
  freeze_critic_encoder: false
  actor_success_only: true

vla:
  lora_rank: 16
  # 0.0 = actor(VLA LoRA) 동결. r000 실측: 배울 신호가 없는 데이터(자기 성공 롤아웃)에서
  # 3e-4 로 60스텝 만에 정책 파괴 (|Δa| 평균 0.038/dim, 최대 1.16 — actor_loss 0.006
  # 바닥에서 Adam 이 노이즈 방향으로 lr 크기만큼 표류). lr 을 낮춰도 표류는 누적되므로
  # 신호가 생길 때까지 끈다.
  # **켜는 것은 자동/예정이 아니라 별도 결정 사항이다** — 아예 안 켜고 test-time
  # 개선(critic 선택 + edit)만으로 가는 것도 유효한 선택지 (VLA 거동 리스크 원천 차단.
  # 대신 개선이 base ± edit_scale 상자 안으로 제한됨). 켜기로 결정한다면 최소 조건:
  # candidate_q_std > 0.001 + 성공 에피소드에 edit 실행분 축적, 그때 1e-5 부터.
  lora_lr: 0.0
  freeze_backbone: true

# --- 라운드 운영 (fuji.yaml 의 주석 참고 — EXPO-FT 프로토콜 대응) ---------------
round:
  episodes_per_round: 5
  updates_per_episode: 3
  # 시드 데모: BC 학습에 쓴 성공 teleop 을 버퍼 맨 앞에 넣는다 (EXPO-FT --num_data).
  # 학습서버의 $L_DS 에 올린 teleop 데이터셋 경로 (repo 상대). 라운드 전에 확인할 것.
  seed_dataset: rl-dataset/t0_rc_320x192
  seed_teleop_episodes: 20
  seed_success_only: true
  # 온라인 롤아웃 에피소드가 이 수에 닿기 전에는 버퍼에만 넣고 학습하지 않는다.
  min_online_episodes: 10
  buffer_capacity: 100000        # TODO: 코드가 아직 읽지 않는다 (fuji.yaml 과 동일)
