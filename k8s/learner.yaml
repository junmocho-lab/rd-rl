# rd-rl learner — 상시 대기 잡 (현재는 학습 stub, CPU 만).
#
# 시작하면 먼저 θ₀ (critic + 인코더 + edit policy + temperature) 를
# $L_CKPT/expo/<run id>/init/ 로 내보낸다. actor 가 그것을 받아 round 0 을 돈다
# (./actor/recv_round.py --round init).
#
# 라운드 메일박스를 폴링하다가 actor 가 READY 를 올리면 검증 → (학습) → DONE 을 쓴다.
# 실제 학습을 붙일 때 바뀌는 것은 두 곳뿐: resources 에 GPU 추가, activeDeadlineSeconds 를 48h.
#
#   제출: ./actor/start_learner.sh [실험이름]
#         (이 yaml 은 __RUN_ID__ / __JOB_NAME__ 플레이스홀더가 있어 직접 apply 하면 안 된다)
#   로그: kubectl -n p-rlwrld logs -f job/<JOB_NAME>   ← start_learner.sh 가 출력한다
#         (잡을 지워도 DDN 에 남는다: $L_RUNS/<exp>/learner.log)
#   중단: kubectl -n p-rlwrld delete job <JOB_NAME>
#         → 컨테이너에 SIGTERM 이 가고 loop.py 가 그걸 로그에 남기고 종료한다
#            (축출/preemption 과 크래시를 로그로 구분할 수 있게 해둔 이유)

apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: p-rlwrld
  labels:
    # normal — RLDX-1 학습 잡이 쓰는 클래스. background 로 올렸더니 플랫폼이 2분 만에
    # Job 을 suspend 했다 (spec.suspend=true → 파드에 SIGTERM). 상시 대기 잡은 normal.
    mlxp/job-class: normal
    project-code: rd
    project-short-name: rd
    user: junmo_cho
spec:
  ttlSecondsAfterFinished: 3600
  # DeadlineExceeded 는 재시도되지 않는다 (다시 apply 해야 한다). 상태는 DDN 에 있으므로
  # 재제출하면 DONE/FAILED 없는 라운드부터 이어받는다.
  activeDeadlineSeconds: 86400 # 24h. 실제 학습 잡은 172800 (48h)
  backoffLimit: 3
  template:
    metadata:
      labels:
        mlxp/job-class: normal # 파드에도 필수 — Job 라벨만으론 fallback 된다
        project-code: rd
        project-short-name: rd
        user: junmo_cho
      annotations:
        mlx.navercorp.com/zone: private-h200-rlwrld-0
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: mlxp-registry
      nodeSelector:
        mlx.navercorp.com/zone: private-h200-rlwrld-0
      volumes:
        - name: ddn
          persistentVolumeClaim:
            claimName: ddn-rlwrld-shared
      containers:
        - name: main
          image: mlxp.kr.ncr.ntruss.com/rlwrld-gpu-base:latest
          env:
            # 잡 파라미터만 둔다. 경로·인터프리터는 configs/paths.sh 가 정본이다.
            # run id = <실험이름>_<날짜-시각>. 매번 새 이름이라 이전 run 의 DONE/FAILED 와
            # 섞이지 않는다 (같은 라운드 번호로 재테스트해도 리셋된 상태로 시작한다).
            - name: RDRL_EXP
              value: "__RUN_ID__"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              source /data/junmo_cho/workspace/rd-rl/configs/paths.sh
              cd "$L_RL"

              echo "[paths] L_RUNS=$L_RUNS"
              echo "[paths] L_CKPT=$L_CKPT"
              echo "[paths] L_DS=$L_DS"
              echo "[python] $L_PY $("$L_PY" -V 2>&1)"

              # rldx 를 **우리가 pin 한 서브모듈**에서 import 하게 만든다. 없으면 venv 에
              # 설치된 다른 체크아웃이 잡혀서, 기록에는 우리 SHA 가 남는데 실제로는 다른
              # 코드가 도는 상황이 된다 (RECAP round 1 에서 한 번 물린 그 문제).
              export PYTHONPATH="$L_PYTHONPATH"
              export NO_ALBUMENTATIONS_UPDATE=1
              echo "[pythonpath] $PYTHONPATH"

              exec "$L_PY" learner/loop.py \
                  --exp "$RDRL_EXP" \
                  --exp-config "configs/exp/__EXP_NAME__.yaml" \
                  --runs-root "$L_RUNS" \
                  --ckpt-root "$L_CKPT" \
                  --repo "$L_RL" \
                  --poll-seconds 5 \
                  --heartbeat-seconds 300 \
                  --updates-per-episode 11 \
                  --stub-seconds 5 \
                  --stub-payload-mb 1
          volumeMounts:
            - name: ddn
              mountPath: /data
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits: { cpu: "500m", memory: "4Gi" }
